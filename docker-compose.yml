# Docker Compose for Dead Man's Slot Machine
# Run: docker compose up
# This starts PostgreSQL, the Express API, and Mailpit (email catcher).

services:
  # --- PostgreSQL database ---
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deadmans
      POSTGRES_PASSWORD: deadmans_secret
      POSTGRES_DB: deadmans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadmans"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Express API ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://deadmans:deadmans_secret@db:5432/deadmans
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  # --- Mailpit (catches emails locally for password reset testing) ---
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # Web UI - open this in browser to see caught emails
      - "1025:1025"   # SMTP port - API sends emails here
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
