openapi: 3.1.0
info:
  title: Dead Man's Slot Machine API
  description: Wild West themed slot machine game API (simulation only, no real money)
  version: 0.3.0
  contact:
    name: Tin Minarik
    email: tinminarik00@gmail.com

servers:
  - url: http://localhost:3000
    description: Local development

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    Currency:
      type: string
      enum: [CHIPS, USD, EUR, GBP, BTC, ETH, LTC, SOL, DOGE, ADA]

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currency:
          $ref: "#/components/schemas/Currency"
        balance:
          type: string
          description: Decimal balance as string for precision
        updatedAt:
          type: string
          format: date-time

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, CONVERSION_IN, CONVERSION_OUT, BET, WIN]
        amount:
          type: string
        balanceAfter:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        wallet:
          type: object
          properties:
            currency:
              $ref: "#/components/schemas/Currency"

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns API and database health status
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    enum: [connected, disconnected]

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                  format: email
                  example: cowboy@deadmans.com
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: wild_bill
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  example: shootFirst123
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  accessToken:
                    type: string
        "409":
          description: Email or username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: cowboy@deadmans.com
                password:
                  type: string
                  example: shootFirst123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token using a refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        "401":
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke refresh token)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: Always returns success to prevent account enumeration
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: cowboy@deadmans.com
      responses:
        "200":
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token from email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid or expired reset token

  /wallet:
    get:
      tags: [Wallet]
      summary: List all wallets for the current user
      description: Returns all currency wallets. Auto-creates a CHIPS wallet with 1000 welcome bonus on first access.
      operationId: getWallets
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User wallets and conversion rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
                  rates:
                    type: object
                    description: Conversion rates (currency → CHIPS)
                    example: { CHIPS: 1, USD: 100, EUR: 120, GBP: 140 }

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Get transaction history
      description: Returns the 50 most recent transactions across all wallets
      operationId: getTransactions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"

  /wallet/deposit:
    post:
      tags: [Wallet]
      summary: Deposit virtual funds
      operationId: deposit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                currency:
                  $ref: "#/components/schemas/Currency"
                  default: CHIPS
                amount:
                  type: number
                  minimum: 0.01
                  maximum: 1000000
                  example: 500
      responses:
        "200":
          description: Deposit successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: "#/components/schemas/Wallet"
                  transaction:
                    $ref: "#/components/schemas/Transaction"

  /wallet/withdraw:
    post:
      tags: [Wallet]
      summary: Withdraw virtual funds
      operationId: withdraw
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                currency:
                  $ref: "#/components/schemas/Currency"
                  default: CHIPS
                amount:
                  type: number
                  minimum: 0.01
                  example: 100
      responses:
        "200":
          description: Withdrawal successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    $ref: "#/components/schemas/Wallet"
                  transaction:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /wallet/convert:
    post:
      tags: [Wallet]
      summary: Convert between currencies
      description: "Converts virtual funds between currencies. Rates: 1 USD = 100 CHIPS, 1 EUR = 120 CHIPS, 1 GBP = 140 CHIPS."
      operationId: convertCurrency
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount]
              properties:
                from:
                  $ref: "#/components/schemas/Currency"
                to:
                  $ref: "#/components/schemas/Currency"
                amount:
                  type: number
                  minimum: 0.01
                  example: 10
      responses:
        "200":
          description: Conversion successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    $ref: "#/components/schemas/Wallet"
                  dest:
                    $ref: "#/components/schemas/Wallet"
                  converted:
                    type: number
                    description: Amount credited to destination
                  rate:
                    type: string
                    description: Human-readable rate
        "400":
          description: Insufficient balance or invalid conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /wallet/rates:
    get:
      tags: [Wallet]
      summary: Get currency conversion rates
      operationId: getRates
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Conversion rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates:
                    type: object
                    example: { CHIPS: 1, USD: 100, EUR: 120, GBP: 140 }

  /me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
